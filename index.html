<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mohenjo-daro · Lost Cities</title>
    <meta name="description" content="Walk a city of baked brick, c. 2500 BCE. An interactive reconstruction of Mohenjo-daro that shows how sure we are about every wall." />
    <meta name="theme-color" content="#14100d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="The landscape of Mohenjo-daro on the Indus plain"></canvas>

    <div id="labels" class="labels" aria-hidden="true"></div>

    <section id="opening" class="opening">
      <div class="opening-inner">
        <p class="eyebrow">Lost Cities</p>
        <h1>Mohenjo-daro</h1>
        <p class="lede">A city of baked brick on the Indus, around 2500 BCE.</p>
        <div class="begin">
          <button type="button" data-sound="on" disabled>Begin with sound</button>
          <button type="button" data-sound="off" class="quiet" disabled>Begin in silence</button>
        </div>
        <p id="loading" class="loading">Preparing the landscape…</p>
      </div>
    </section>

    <button id="note-button" type="button" class="note-button" aria-expanded="false" aria-controls="note-panel" hidden>
      How true is this?
    </button>

    <div id="certainty" class="certainty" hidden>
      <div id="legend" class="legend" aria-hidden="true">
        <span class="lg excavated"><i></i>Excavated</span>
        <span class="lg inferred"><i></i>Inferred</span>
        <span class="lg imagined"><i></i>Imagined</span>
      </div>
      <div class="mode-switch" role="radiogroup" aria-label="View">
        <button type="button" role="radio" data-mode="alive" aria-checked="true" class="on">Alive</button>
        <button type="button" role="radio" data-mode="evidence" aria-checked="false">Evidence</button>
      </div>
    </div>

    <button id="time-button" type="button" class="time-button" aria-expanded="false" aria-controls="time-panel" hidden></button>
    <div id="time-panel" class="time-panel" role="dialog" aria-label="Time and season"></div>

    <button id="era-button" type="button" class="era-button" aria-expanded="false" aria-controls="era-panel" hidden>c. 2500 BCE</button>
    <div id="era-panel" class="era-panel" role="dialog" aria-label="The city through time"></div>
    <div id="split" class="split" aria-hidden="true">
      <span class="split-label split-left"></span>
      <span class="split-label split-right">Today</span>
      <div class="split-handle"><span></span></div>
      <button type="button" class="split-close" aria-label="Close then and now">×</button>
    </div>

    <button id="walk-button" type="button" class="walk-button" aria-label="Walk the streets at eye height" hidden>Walk</button>
    <canvas id="minimap" class="minimap" width="300" height="300" aria-label="Map: click to go there"></canvas>
    <button id="walk-out" type="button" class="walk-out" hidden>Find a way out</button>
    <div id="walk-fade" class="walk-fade" aria-hidden="true"></div>
    <p id="walk-hint" class="walk-hint" role="status"></p>
    <div id="joystick" class="joystick" aria-hidden="true"><div class="knob"></div></div>

    <button id="sound-button" type="button" class="sound-button" aria-pressed="false" aria-label="Sound off: turn it on" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button id="guide-button" type="button" class="guide-button" aria-expanded="false" aria-controls="guide-panel" hidden>Guide</button>
    <aside id="guide-panel" class="guide-panel" role="dialog" aria-label="Guide: tour and places"></aside>
    <section id="tour-card" class="tour-card" aria-label="Tour" aria-live="polite"></section>

    <button id="chat-button" type="button" class="chat-button" aria-expanded="false" aria-controls="chat-panel" hidden>Talk to a resident</button>
    <aside id="chat-panel" class="chat-panel" aria-label="Talk to a resident"></aside>

    <button id="script-button" type="button" class="script-button" aria-expanded="false" aria-controls="script-panel" hidden>Indus script</button>
    <aside id="script-panel" class="script-panel" role="dialog" aria-label="The Indus script"></aside>

    <aside id="info-panel" class="info-panel" aria-live="polite"></aside>
    <aside id="note-panel" class="note-panel" aria-label="How true is this?"></aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
